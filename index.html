<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Brand: Version Teal (2026). Matches the ground painted by the app shell
         so there is no flash of white before React mounts. -->
    <meta name="theme-color" content="#0F4A58" />
    <meta name="color-scheme" content="light" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <title>A Story — keep the memories that only live in one person's head</title>
    <meta
      name="description"
      content="A Story turns guided voice conversations into a private, searchable archive and a printed hardcover book. For families, care communities, and organizations preserving the history that made them."
    />
    <link rel="canonical" href="https://astoryapp.com/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="A Story" />
    <meta property="og:title" content="A Story — keep the memories that only live in one person's head" />
    <meta
      property="og:description"
      content="Guided voice conversations become a private, searchable archive — and a printed hardcover book. For families, care communities and organizations."
    />
    <meta property="og:url" content="https://astoryapp.com/" />
    <meta property="og:image" content="https://astoryapp.com/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A Story — Your Family's Living Memories" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="A Story — keep the memories that only live in one person's head" />
    <meta
      name="twitter:description"
      content="Guided voice conversations become a private, searchable archive — and a printed hardcover book."
    />
    <meta name="twitter:image" content="https://astoryapp.com/og-cover.png" />

    <!-- Brand typography per the guideline: Cormorant Garamond (display),
         Figtree (body), Caveat (script accent). Preconnect first so the font
         request starts before the CSS is parsed. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,600&family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "A Story",
        "url": "https://astoryapp.com",
        "email": "contact@astoryapp.com",
        "slogan": "Your Family's Living Memories",
        "logo": "https://astoryapp.com/logo.png",
        "description": "A Story turns guided voice conversations into a permanent, searchable archive — and a printed hardcover book — for families, care communities and organizations."
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width: 42rem; margin: 4rem auto; padding: 0 1.5rem; font-family: system-ui, sans-serif; color: #4C4C4C;">
        <h1 style="font-size: 1.75rem; color: #0F4A58;">A Story</h1>
        <p>
          A Story turns guided voice conversations with the people who hold your memories into a private,
          searchable archive — and a printed hardcover book. Built for families, care communities and
          organizations preserving the history that made them.
        </p>
        <p>This site needs JavaScript enabled. In the meantime, reach us at
          <a href="mailto:contact@astoryapp.com" style="color: #B85126;">contact@astoryapp.com</a>.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
