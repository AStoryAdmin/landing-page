<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Brand: A Story editorial web identity (2026). Matches the ground painted by the app shell
         so there is no flash of white before React mounts. -->
    <meta name="theme-color" content="#4A3327" />
    <meta name="color-scheme" content="light" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <title>A Story - Your Family’s Living Memories</title>
    <meta
      name="description"
      content="A Story calls a parent or grandparent, asks about their life, and keeps what they tell in a private archive the whole family can add to - and print as a book."
    />
    <link rel="canonical" href="https://astoryapp.com/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="A Story" />
    <meta property="og:title" content="A Story - Your Family’s Living Memories" />
    <meta
      property="og:description"
      content="Preserve family stories through guided conversation, photographs, original words, voice, and multiple perspectives. Keep a private living archive and print a chapter when you choose."
    />
    <meta property="og:url" content="https://astoryapp.com/" />
    <meta property="og:image" content="https://astoryapp.com/og/home.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A Story - Your Family's Living Memories" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="A Story - Your Family’s Living Memories" />
    <meta
      name="twitter:description"
      content="A private family archive built through conversation."
    />
    <meta name="twitter:image" content="https://astoryapp.com/og/home.jpg" />

    <!-- The web app's faces (2026-10-23, phase 2: the site is the app's world). Montserrat is the
         interface, self-hosted from the app (one variable latin file covers 400-700). The book's
         faces come from Google Fonts, as the app loads them: Cormorant Garamond for every heading
         (600 and 700 only, so a heading written at 400 or 500 is set at the app's 600), EB Garamond
         for reading, Caveat for the handwritten captions under prints. fonts.css (Figtree, Source
         Serif 4) stays linked only for the drawn app screens that still name them; its faces
         download only where a page uses them. -->
    <link rel="preload" href="/fonts/montserrat-1.woff2" as="font" type="font/woff2" crossorigin />
    <link href="/fonts/montserrat.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500;1,600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap"
      rel="stylesheet"
    />
    <link href="/fonts/fonts.css" rel="stylesheet" />

    <!-- Doors into the web app, before anything paints (2026-10-18). Invitations
         (/?ref=CODE, /join?ref=CODE, /join/CODE), contribute links (/c/SLUG) and the
         site's old sign-in, sign-up, account and start pages go to app.astoryapp.com;
         www goes to the bare domain. The reservation's own sign-in (?next=/reserve)
         stays here. deploy/cloudfront-viewer-request.js does the same at the edge;
         src/pages/site/AppDoor.tsx is the fallback. Skipped while prerendering. -->
    <script>
      (function () {
        try {
          if (window.__PRERENDER) return;
          var APP = "https://app.astoryapp.com", l = location, q = new URLSearchParams(l.search);
          var p = l.pathname.replace(/\/index\.html$/, "/"), ref = q.get("ref") || "", to = "", m;
          if (l.hostname === "www.astoryapp.com") to = "https://astoryapp.com" + l.pathname + l.search + l.hash;
          else if ((m = p.match(/^\/join\/([A-Za-z0-9]{6})\/?$/))) to = APP + "/join/" + m[1].toUpperCase();
          else if (/^\/(join\/?)?$/.test(p) && /^[A-Za-z0-9]{6}$/.test(ref)) to = APP + "/join/" + ref.toUpperCase();
          else if ((m = p.match(/^\/c\/([A-Za-z0-9_-]{1,80})\/?$/))) to = APP + "/c/" + m[1];
          else if (!/^\/reserve/.test(q.get("next") || "")) {
            if (/^\/(sign-in|signin|login)\/?$/.test(p)) to = APP + "/sign-in";
            else if (/^\/(sign-up|signup)\/?$/.test(p)) to = APP + "/create-account";
            else if (/^\/account\/?$/.test(p)) to = APP + "/";
            else if (/^\/start\/?$/.test(p) && q.get("intent") !== "demo") to = APP + "/create-account";
          }
          if (to) l.replace(to);
        } catch (e) {}
      })();
    </script>

    <!-- The home intro cover (home/Intro.tsx) was removed from Home on 2026-10-23: it held the
         page for five seconds every session. The open book on the cloth is the opening now. -->


  </head>
  <body>
    <div id="root"></div>
    <!-- Only for a browser with scripts off. It must never read as a beta notice:
         the name, one sentence, and where to write. scripts/prerender.mjs strips
         it from the static snapshots, which carry the whole page without it. -->
    <noscript>
      <div style="max-width: 36rem; margin: 18vh auto 0; padding: 0 1.5rem; font-family: 'Montserrat', 'Segoe UI', system-ui, sans-serif; color: #2A2320; line-height: 1.6;">
        <p style="margin: 0 0 1rem; font: 600 2.5rem/1.1 'Cormorant Garamond', Georgia, serif; color: #4A3327; letter-spacing: -0.02em;">A Story</p>
        <p style="margin: 0 0 1rem; font-size: 1.125rem;">
          A Story calls someone you love, listens, and keeps what they say in a private archive the whole family can add to, and print as a book.
        </p>
        <p style="margin: 0; font-size: 1rem; color: #685848;">
          This page needs scripts switched on. You can also write to us at
          <a href="mailto:contact@astoryapp.com" style="color: #9E4420;">contact@astoryapp.com</a>.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
